# suspend-then-hibernate: s2idle keeps draining the battery, so hibernate after
# 2 h asleep. On AC the countdown only starts once the charger is unplugged.
#
# SuspendEstimationSec matches HibernateDelaySec so the first RTC wake is the
# hibernate. With the default (1h) systemd wakes once to measure the battery and
# suspends again, but NVIDIA's system-sleep hook only re-arms the driver for
# hibernate, so that second suspend fails (-5, EIO) and the laptop stays awake.
[Sleep]
HibernateDelaySec=2h
SuspendEstimationSec=2h
HibernateOnACPower=no
