# Deployed to: /etc/systemd/system/mnt_data-.mount.d/10-no-start-limit.conf
# Prefix drop-in: applies to every mnt_data-*.mount (all /mnt_data NFS shares).
#
# The shares are VPN-only and the VPN is never up at boot. A job that touches
# many paths before the VPN is up (2026-11-21: gpsplot-rtk-map right after
# login) makes the mount fail 5+ times in 10 s on DNS; systemd then hits the
# start limit and fails the *automount* with 'mount-start-limit-hit', leaving
# a plain empty directory that never mounts again until reset-failed.
# Without a start limit each access just retries; a failed attempt costs
# milliseconds (DNS) or at most x-systemd.mount-timeout=10.

[Unit]
StartLimitIntervalSec=0
