# Memory guard for user sessions.
#
# Added after the 2026-09-20 freeze. What happened:
#   The user slice grew unbounded to ~58 GB anonymous + a completely full 8 GB
#   swap. At 13:41 the host entered a global reclaim storm (sysstat recorded
#   0.14% idle / 89% kernel time), the kernel OOM killer fired 4x, and the
#   desktop hard-wedged for ~3 hours until it was power-cycled. sysstat could
#   not collect a single sample between 13:41 and the 16:46 reboot.
#
# MemoryHigh (soft) — the kernel starts throttling allocations and reclaiming
#   aggressively once the slice crosses this. NO process is killed. This is the
#   part that prevents the freeze, and it is enforced in the kernel, so it still
#   works when userspace (including systemd-oomd) is too starved to run — which
#   is exactly what happened during the incident.
#
# MemoryMax (hard) — backstop only. On reaching this the *cgroup* OOM killer
#   picks a victim inside the user slice, so one browser/app dies instead of the
#   whole desktop locking up.
#
# Host is 61 GiB RAM. These leave roughly 5-10 GiB of headroom for
# system.slice, the kernel, and page cache.
#
# Note: in cgroup v2 the memory counter includes charged swap, so these bounds
# cover RAM + swap together. Swap itself is separately uncapped
# (memory.swap.max = max).

[Slice]
MemoryAccounting=yes
MemoryHigh=46G
MemoryMax=54G
