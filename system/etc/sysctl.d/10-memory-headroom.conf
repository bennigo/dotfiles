# Keep a real reserve of free pages so kswapd wakes up and reclaims *before*
# the system is completely out of memory.
#
# Default on this host was 67584 kB (~66 MB) against 61 GiB of RAM — far too
# small. By the time reclaim began, allocation paths were already stalling on
# the critical path, which is what turned the 2026-09-20 OOM into a 3-hour
# hard freeze rather than a clean OOM kill.
#
# 262144 kB = 256 MB, i.e. ~0.4% of RAM. Costs nothing, buys a much earlier
# reclaim start.

vm.min_free_kbytes=262144
