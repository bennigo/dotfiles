# Swapping policy — revised after the 2026-09-20 freeze.
#
# Previously 10. With zswap enabled (kernel cmdline zswap.enabled=1) a low
# swappiness is self-defeating: it tells the kernel to avoid swapping at almost
# any cost, so instead of compressing cold anonymous pages into the zswap pool
# the kernel went straight to direct reclaim, then to the OOM killer.
#
# 60 lets the kernel page out genuinely cold pages while keeping hot working
# sets resident.
vm.swappiness=60
