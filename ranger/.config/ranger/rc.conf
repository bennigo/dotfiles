set preview_images true
set preview_images_method kitty

# Wider file column. 1,2,7 gave the listing only 20% of the width, which
# truncates real figure names ("SENG-detrend-clea~.pdf") — and inside herdr the
# sidebar takes a chunk of the window before ranger even starts. The preview
# still gets half the width, which is plenty for a plot.
set column_ratios 1,3,4

# Converted previews (PDF/PS/EPS via scope.sh, exit 6) come back blank while
# native images (exit 7) render fine. Ranger's own source flags this in
# core/actions.py::get_preview:
#   "XXX: Previews can break when collapse_preview is on and the preview column
#    is popping out as you move the cursor on e.g. a PDF file."
# The collapsed column has no width when the preview is requested, so the image
# is drawn into a zero-sized box. Toggle live with `zc` to compare.
set collapse_preview false
