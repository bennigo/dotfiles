# Laptop -> external mirror, or the external's original independent workspace.
# Match only this helper's window; leave other wl-mirror sessions alone.
for_window [app_id="^at.yrlf.wl_mirror$" title="^Sway laptop mirror$"] floating enable, border none
no_focus [app_id="^at.yrlf.wl_mirror$" title="^Sway laptop mirror$"]

## Displays // Toggle laptop mirror / independent external workspace // 🖥️ ##
bindsym --no-repeat F7 exec ~/.config/sway/scripts/display-toggle.py
## Displays // Toggle laptop mirror (ThinkPad display key / Fn+F7) // 🖥️ ##
bindsym --no-repeat XF86Display exec ~/.config/sway/scripts/display-toggle.py
