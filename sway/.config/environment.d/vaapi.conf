# VA-API video decode on the Intel iGPU (intel-media-va-driver-non-free).
# Was LIBVA_DRIVER_NAME=nvidia (NVDEC): that made the Chrome and Obsidian GPU
# processes open /dev/nvidia0 + nvidia-uvm, which keeps the RTX 2000 awake and
# stops runtime D3 on battery. Back to nvidia: set it here and log in again.
LIBVA_DRIVER_NAME=iHD
